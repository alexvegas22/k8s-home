apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloud
resources:
  - namespace.yaml
  - helmrelease.yaml
  - resources/ingress.yaml
  - postgres.yaml

configMapGenerator:
  - name: immich-values
    files:
      - values.yaml=helm/values.yaml

configurations:
  - kustomizeconfig.yaml
