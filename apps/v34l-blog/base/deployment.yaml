apiVersion: apps/v1
kind: Deployment
metadata:
  name: v34l-blog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: v34l-blog
  template:
    metadata:
      labels:
        app: v34l-blog
    spec:
      containers:
        - name: v34l-blog
          image: ghcr.io/alexvegas22/0xv34l@sha256:a97d6acce9e4f8e154d3a6d89f6bec0338d9358da82f8b596eedaa014eb0b39b
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: "128Mi"
              cpu: "250m"
