apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-runner
  namespace: argocd
spec:
  destination:
    namespace: forgejo-runner
    server: https://kubernetes.default.svc

  project: k8s-home

  source:
    path: apps/forgejo-runner
    repoURL: https://github.com/alexvegas22/k8s-home.git
    targetRevision: talos

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
