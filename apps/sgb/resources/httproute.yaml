apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sgb
  namespace: sgb
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - sgb.m15ty.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: sgb
          port: 80
          weight: 1
