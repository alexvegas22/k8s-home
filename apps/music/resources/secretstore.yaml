apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: music
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: music
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: music
          serviceAccountRef:
            name: music-secrets
