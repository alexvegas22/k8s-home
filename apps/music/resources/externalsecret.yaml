apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: music-oauth2-proxy
  namespace: music
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: openbao
    kind: SecretStore

  target:
    name: music-oauth2-proxy
    creationPolicy: Owner
    deletionPolicy: Retain

  data:
    - secretKey: cookie-secret
      remoteRef:
        key: config
        property: cookie-secret
