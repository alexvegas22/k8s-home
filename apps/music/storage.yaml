# Music library and download dirs live on the NAS so they can be managed
# independently of the cluster (rsync, SMB, beets, manual drops, ...).
# Both exports must exist on 192.168.1.3:
#   /mnt/nfs/music       <- the library (Navidrome mounts it read-only)
#   /mnt/nfs/downloads   <- Lidarr's download client output + completed imports
apiVersion: v1
kind: PersistentVolume
metadata:
  name: music-library
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-client
  claimRef:
    namespace: music
    name: music-library
  nfs:
    server: 192.168.1.3
    path: /mnt/nfs/music
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music-library
  namespace: music
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  volumeName: music-library
  resources:
    requests:
      storage: 2Ti
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: music-downloads
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-client
  claimRef:
    namespace: music
    name: music-downloads
  nfs:
    server: 192.168.1.3
    path: /mnt/nfs/downloads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music-downloads
  namespace: music
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  volumeName: music-downloads
  resources:
    requests:
      storage: 1Ti
---
# Application state stays off NFS on purpose: Navidrome and Lidarr both use
# SQLite, which does not survive network filesystems (locking) reliably.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-data
  namespace: music
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lidarr-config
  namespace: music
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
