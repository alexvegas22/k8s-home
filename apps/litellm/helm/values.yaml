replicaCount: 1

image:
  repository: ghcr.io/berriai/litellm
  tag: "1.106.4"

service:
  type: ClusterIP
  port: 4000

# Secret is created by External Secrets from OpenBao.
masterkeySecretName: litellm-credentials
masterkeySecretKey: LITELLM_MASTER_KEY

environmentSecrets:
  - litellm-credentials

envVars:
  STORE_MODEL_IN_DB: "True"

proxy_config:
  model_list:
    # OpenCode Zen
    - model_name: deepseek-v4.1-flash
      litellm_params:
        model: openai/deepseek-v4.1-flash
        api_base: https://opencode.ai/zen/go/v1
        api_key: os.environ/OPENCODE_API_KEY

    - model_name: gpt-6-luna
      litellm_params:
        model: openai/gpt-6-luna
        api_base: https://opencode.ai/zen/go/v1
        api_key: os.environ/OPENCODE_API_KEY

    - model_name: gpt-5.6-luna
      litellm_params:
        model: openai/gpt-5.6-luna
        api_base: https://opencode.ai/zen/go/v1
        api_key: os.environ/OPENCODE_API_KEY

    # OpenAI
    - model_name: gpt-6.1-sol
      litellm_params:
        model: openai/gpt-6.1-sol
        api_key: os.environ/OPENAI_API_KEY

    - model_name: gpt-4.1
      litellm_params:
        model: openai/gpt-4.1
        api_key: os.environ/OPENAI_API_KEY

  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY

  litellm_settings:
    drop_params: true

db:
  useExisting: true
  deployStandalone: false
  endpoint: litellm-db-rw.litellm.svc
  database: litellm
  secret:
    name: litellm-db-app
    usernameKey: username
    passwordKey: password

# The proxy owns schema initialization for this single-replica deployment.
# This avoids the chart's ArgoCD pre-sync migration job racing the CNPG cluster.
migrationJob:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi
