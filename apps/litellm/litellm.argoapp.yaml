apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-home

  source:
    repoURL: https://github.com/alexvegas22/k8s-home
    targetRevision: talos
    path: apps/litellm

  destination:
    server: https://kubernetes.default.svc
    namespace: litellm

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
