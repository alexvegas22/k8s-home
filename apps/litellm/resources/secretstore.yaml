apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: litellm
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: litellm
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: litellm
          serviceAccountRef:
            name: litellm-secrets
