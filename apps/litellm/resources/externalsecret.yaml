apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-credentials
  namespace: litellm
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: openbao
    kind: SecretStore

  target:
    name: litellm-credentials
    creationPolicy: Owner
    deletionPolicy: Retain

  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: config
        property: LITELLM_MASTER_KEY
    - secretKey: LITELLM_SALT_KEY
      remoteRef:
        key: config
        property: LITELLM_SALT_KEY
    - secretKey: OPENCODE_API_KEY
      remoteRef:
        key: config
        property: OPENCODE_API_KEY
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: config
        property: OPENAI_API_KEY
    - secretKey: UI_USERNAME
      remoteRef:
        key: config
        property: UI_USERNAME
    - secretKey: UI_PASSWORD
      remoteRef:
        key: config
        property: UI_PASSWORD
