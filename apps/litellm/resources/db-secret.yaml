apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-db-app
  namespace: litellm
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: openbao
    kind: SecretStore

  target:
    name: litellm-db-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth

  data:
    - secretKey: username
      remoteRef:
        key: config
        property: DB_USERNAME
    - secretKey: password
      remoteRef:
        key: config
        property: DB_PASSWORD
