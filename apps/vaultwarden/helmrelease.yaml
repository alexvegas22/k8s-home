---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  interval: 1h
  releaseName: vaultwarden
  chart:
    spec:
      chart: vaultwarden
      version: "0.43.1"
      sourceRef:
        kind: HelmRepository
        name: vaultwarden
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: vaultwarden-values
      valuesKey: values.yaml
