apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vaultwarden
resources:
  - namespace.yaml
  - helmrelease.yaml
  - resources/httproute.yaml

configMapGenerator:
  - name: vaultwarden-values
    files:
      - values.yaml=helm/values.yaml

configurations:
  - kustomizeconfig.yaml
