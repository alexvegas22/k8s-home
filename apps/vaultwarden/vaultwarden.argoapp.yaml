apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden
  namespace: argocd
spec:
  destination:
    namespace: vaultwarden
    server: https://kubernetes.default.svc
  project: k8s-home
  source:
    path: apps/vaultwarden
    repoURL: https://github.com/alexvegas22/k8s-home.git
    targetRevision: talos
  syncPolicy:
    automated:
      prune: true
      selfHeal: false # TEMP: disabled for DB migration; re-enable after
    syncOptions:
      - CreateNamespace=true
