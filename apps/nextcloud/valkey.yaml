apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: nextcloud-valkey
  namespace: cloud
spec:
  shards: 1
  replicas: 0
  workloadType: Deployment
  users:
    - name: default
      passwordSecret:
        name: nextcloud-valkey-users
        keys:
          - default
      permissions: "+@all ~* &*"
