image:
  repository: nextcloud
  flavor: apache
  tag: 33.0.10
  pullPolicy: IfNotPresent

replicaCount: 1

ingress:
  enabled: false

nextcloud:
  host: nextcloud.m15ty.com
  existingSecret:
    enabled: true
    secretName: nextcloud-creds
    usernameKey: username
    passwordKey: password
  defaultConfigs:
    reverse-proxy.config.php: true
  configs:
    trusted-proxy.config.php: |-
      <?php
      $CONFIG = array (
        'trusted_proxies' => ['10.42.0.0/16'],
        'overwriteprotocol' => 'https',
        'overwritehost' => 'nextcloud.m15ty.com',
        'overwrite.cli.url' => 'https://nextcloud.m15ty.com',
        'forwarded_for_headers' => ['HTTP_X_FORWARDED_FOR'],
      );
  update: 0
  containerPort: 80
  datadir: /var/www/html/data
  trustedDomains:
    - nextcloud.m15ty.com
    - localhost

phpClientHttpsFix:
  enabled: true
  protocol: https

internalDatabase:
  enabled: false

mariadb:
  enabled: false

postgresql:
  enabled: false

externalDatabase:
  enabled: true
  type: postgresql
  host: nextcloud-db-rw
  user: nextcloud
  database: nextcloud
  existingSecret:
    enabled: true
    secretName: nextcloud-cnpg-secret
    usernameKey: username
    passwordKey: password

redis:
  enabled: true
  architecture: standalone
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
  persistence:
    enabled: true
    storageClass: "nfs-client"
    accessMode: ReadWriteOnce
    size: 2Gi

service:
  type: ClusterIP
  port: 80

persistence:
  enabled: true
  existingClaim: fs-pvc
  mountPath: /var/www/html/data
  nextcloudConfig:
    enabled: true
    storageClass: "nfs-client"
    accessMode: ReadWriteOnce
    size: 2Gi
  nextcloudDatabase:
    enabled: true
    storageClass: "nfs-client"
    accessMode: ReadWriteOnce
    size: 5Gi

resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "1Gi"
    cpu: "1"
livenessProbe:
  enabled: false
  initialDelaySeconds: 300
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 5
  successThreshold: 1
readinessProbe:
  enabled: false
  initialDelaySeconds: 300
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 5
  successThreshold: 1
startupProbe:
  enabled: false
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
  successThreshold: 1

collabora:
  enabled: true

  autoscaling:
    # enable autocaling, please check collabora README.md first
    enabled: false

  collabora:
    ## HTTPS nextcloud domain, if needed
    aliasgroups:
       - host: "https://nextcloud.m15ty.com:443"

    # set extra parameters for collabora
    # you may need to add --o:ssl.termination=true
    extra_params: --o:ssl.enable=false

    ## Specify server_name when the hostname is not reachable directly for
    # example behind reverse-proxy. example: collabora.domain
    server_name: collabora.nextcloud.m15ty.com

    existingSecret:
      # set to true to to get collabora admin credentials from an existin secret
      # if set, ignores collabora.collabora.username and password
      enabled: true
      # name of existing Kubernetes Secret with collboara admin credentials
      secretName: "collabora-secret"
      usernameKey: "username"
      passwordKey: "password"

  # setup ingress
  ingress:
    # enable ingress for collabora online
    enabled: false
