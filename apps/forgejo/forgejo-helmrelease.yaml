---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 1h
  releaseName: forgejo
  chart:
    spec:
      chart: forgejo
      version: "17.1.0"
      sourceRef:
        kind: HelmRepository
        name: forgejo
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: forgejo-values
      valuesKey: values.yaml
