apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: forgejo
resources:
  - namespace.yaml
  - cnpg.cluster.yaml
  - forgejo-helmrelease.yaml
  - valkey-helmrelease.yaml

configMapGenerator:
  - name: forgejo-values
    files:
      - values.yaml=base/forgejo.values.yaml

configurations:
  - kustomizeconfig.yaml
