---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-cache-valkey
  namespace: forgejo
spec:
  interval: 1h
  releaseName: forgejo-cache
  chart:
    spec:
      chart: valkey-operator
      version: "0.9.3"
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: forgejo-cache-valkey-values
      valuesKey: values.yaml
