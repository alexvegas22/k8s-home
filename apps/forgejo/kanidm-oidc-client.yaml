apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: forgejo
  namespace: forgejo
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm
  displayname: Forgejo
  origin: https://git.m15ty.com
  redirectUrl:
    - https://git.m15ty.com/user/oauth2/kanidm/callback
  disableConsentPrompt: true
  allowInsecureClientDisablePkce: true
  preferShortUsername: true
  secretKeyAliases:
    clientId:
      - key
    clientSecret:
      - secret
  scopeMap:
    - group: forgejo-users
      scopes:
        - openid
        - profile
        - email
        - groups_name
  secretTemplate:
    labels:
      app.kubernetes.io/part-of: forgejo
