---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
data:
  config.yaml: |
    storage:
      type: sqlite
      path: /data/gatus.db

    endpoints:
      - name: blog-v34l
        url: https://blog.v34l.com
        interval: 30s
        conditions:
          - "[STATUS] == 200"
      - name: nextcloud
        url: https://nextcloud.v34l.com
        interval: 30s
        conditions:
          - "[STATUS] == 200"
      - name: vaultwarden
        url: https://vaultwarden.v34l.com
        interval: 30s
        conditions:
          - "[STATUS] == 200"
      - name: immich
        url: https://immich.v34l.com
        interval: 30s
        conditions:
          - "[STATUS] == 200"
      - name: htb
        url: https://htb.v34l.com
        interval: 30s
        conditions:
          - "[STATUS] == 200"
      - name: argocd
        url: https://argocd.v34l.com
        interval: 30s
        conditions:
          - "[STATUS] == 200"
