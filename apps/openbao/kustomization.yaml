apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: openbao
  namespace: openbao
resources:
  - resources/httproute.yaml
helmCharts:
  - name: openbao
    version: "0.30.4"
    repo: "https://openbao.github.io/openbao-helm"
    releaseName: "openbao"
    namespace: openbao
    valuesFile: "helm/values.yaml"
