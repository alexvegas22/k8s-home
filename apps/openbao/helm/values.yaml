global:
  enabled: true
  tlsDisable: true

server:
  image:
    registry: "quay.io"
    repository: "openbao/openbao"
    tag: "2.7.1"
    pullPolicy: IfNotPresent

  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: nfs-client
    accessMode: ReadWriteOnce

  standalone:
    enabled: true

ui:
  enabled: true
  serviceType: "ClusterIP"
  targetPort: 8200
  externalPort: 8200

injector:
  enabled: false

csi:
  enabled: false
