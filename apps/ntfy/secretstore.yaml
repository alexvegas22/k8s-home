apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: ntfy
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ntfy
          serviceAccountRef:
            name: ntfy-secrets
