apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-credentials
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: openbao
    kind: SecretStore

  target:
    name: ntfy-credentials
    creationPolicy: Owner
    deletionPolicy: Retain

  data:
    - secretKey: NTFY_AUTH_USERS
      remoteRef:
        key: config
        property: NTFY_AUTH_USERS
    - secretKey: NTFY_AUTH_TOKENS
      remoteRef:
        key: config
        property: NTFY_AUTH_TOKENS
