apiVersion: apps/v1
kind: Deployment
metadata:
  name: htb-api
  namespace: htb
spec:
  selector:
    matchLabels:
      app: htb-api
  template:
    metadata:
      labels:
        app: htb-api
    spec:
      containers:
      - name: htb-api
        image: ghcr.io/alexvegas22/htb-api@sha256:68751e54250c333b4b50938ad0ba8cbb88ced60687d6bb20ab3fb9bc898471e9
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: REDIS_HOST
          value: "redis-htb-service"
        - name: REDIS_PORT
          value: "6379"
