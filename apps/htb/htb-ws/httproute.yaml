---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: htb-ws
  namespace: htb
spec:
  hostnames:
    - ws.htb.v34l.com
  parentRefs:
    - name: main-gateway
      namespace: gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: htb-ws
          port: 80
