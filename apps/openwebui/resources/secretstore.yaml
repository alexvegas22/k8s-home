apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: openwebui
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: openwebui
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: openwebui
          serviceAccountRef:
            name: openwebui-secrets
