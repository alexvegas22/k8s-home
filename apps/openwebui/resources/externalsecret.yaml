apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-credentials
  namespace: openwebui
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: openbao
    kind: SecretStore

  target:
    name: credentials
    creationPolicy: Owner
    deletionPolicy: Retain

  data:
    - secretKey: OPENAI_API_KEYS
      remoteRef:
        key: config
        property: OPENAI_API_KEYS
    - secretKey: WEBUI_SECRET_KEY
      remoteRef:
        key: config
        property: WEBUI_SECRET_KEY
