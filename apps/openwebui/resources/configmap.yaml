apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-config
  namespace: openwebui
data:
  # Indexes must match openaiBaseApiUrls in helm/values.yaml.
  # Both entries point at the same OpenCode endpoint: one uses the
  # Responses API, the other uses the default chat-completions API.
  openai-api-configs.json: |
    {
      "0": {
        "api_type": "responses",
        "model_ids": [
          "gpt-6-luna",
          "gpt-5.6-luna"
        ],
        "headers": {
          "x-opencode-session": "{{CHAT_ID}}"
        }
      },
      "1": {
        "headers": {
          "x-opencode-session": "{{CHAT_ID}}"
        }
      }
    }
