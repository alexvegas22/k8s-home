apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: open-webui
  namespace: openwebui
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm

  displayname: Open WebUI
  origin: https://chat.m15ty.com
  redirectUrl:
    - https://chat.m15ty.com/oauth/oidc/callback

  disableConsentPrompt: true

  # Open WebUI does not send a PKCE code_challenge, and kanidm enforces
  # PKCE by default (kanidm 1.5+). Required until upstream supports PKCE.
  allowInsecureClientDisablePkce: true

  scopeMap:
    - group: idm_all_persons
      scopes:
        - openid
        - profile
        - email
        - groups
  claimMap:
    - name: roles
      valuesMap:
        - group: idm_all_persons
          values:
            - user
        - group: cluster-admins
          values:
            - admin
      joinStrategy: array
