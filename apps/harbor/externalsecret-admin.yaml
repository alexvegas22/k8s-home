apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-admin
  namespace: harbor
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: openbao-kubernetes
    kind: ClusterSecretStore

  target:
    name: harbor-admin
    creationPolicy: Owner
    deletionPolicy: Retain

  data:
    - secretKey: HARBOR_ADMIN_PASSWORD
      remoteRef:
        key: apps/harbor/admin
        property: HARBOR_ADMIN_PASSWORD
