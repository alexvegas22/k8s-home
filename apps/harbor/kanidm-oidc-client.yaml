apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: harbor
  namespace: harbor
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm

  displayname: Harbor
  origin: https://harbor.m15ty.com
  redirectUrl:
    - https://harbor.m15ty.com/c/oidc/callback

  disableConsentPrompt: true

  # Harbor's OIDC client does not send a PKCE code_challenge and kanidm
  # enforces PKCE for confidential clients by default.
  allowInsecureClientDisablePkce: true

  scopeMap:
    - group: harbor-users
      scopes:
        - openid
        - profile
        - email
        - groups_name

  secretTemplate:
    labels:
      app.kubernetes.io/part-of: harbor
