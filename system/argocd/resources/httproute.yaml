apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: main-gateway
      namespace: gateway

  hostnames:
    - argocd.m15ty.com

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https

      backendRefs:
        - name: argocd-server
          port: 80
