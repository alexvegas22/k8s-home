---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: argocd
spec:
  interval: 1h
  releaseName: argocd
  chart:
    spec:
      chart: argo-cd
      version: "10.1.4"
      sourceRef:
        kind: HelmRepository
        name: argo-cd
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: argocd-values
      valuesKey: values.yaml
