apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - helmrelease.yaml
  - resources/httproute.yaml
  - resources/projects.yaml
  - resources/namespace.yaml

configMapGenerator:
  - name: argocd-values
    files:
      - values.yaml=helm/values.yaml

configurations:
  - kustomizeconfig.yaml
