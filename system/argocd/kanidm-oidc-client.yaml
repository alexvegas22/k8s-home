apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: argocd
  namespace: argocd
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm

  displayname: ArgoCD
  origin: https://argocd.m15ty.com
  redirectUrl:
    - https://argocd.m15ty.com/auth/callback

  disableConsentPrompt: true

  # ArgoCD does not send a PKCE code_challenge, and kanidm enforces
  # PKCE by default (kanidm 1.5+). Required until upstream supports PKCE.
  allowInsecureClientDisablePkce: true

  # ArgoCD only reads secrets labeled app.kubernetes.io/part-of: argocd
  # in its namespace (for $argocd-kanidm-oauth2-credentials:CLIENT_SECRET).
  secretTemplate:
    labels:
      app.kubernetes.io/part-of: argocd

  scopeMap:
    - group: cluster-admins
      scopes:
        - openid
        - profile
        - email
        - groups_name
  claimMap:
    - name: roles
      valuesMap:
        - group: idm_all_persons
          values:
            - user
        - group: cluster-admins
          values:
            - admin
      joinStrategy: array
