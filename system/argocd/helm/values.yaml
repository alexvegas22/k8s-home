global:
  domain: argocd.m15ty.com
  networkPolicy:
    create: false

server:
  ingress:
    enabled: false

  service:
    type: ClusterIP

  certificate:
    enabled: true
    issuer:
      group: cert-manager.io
      kind: ClusterIssuer
      name: letsencrypt-prod

  config:
    admin.enabled: true
    url: https://argocd.m15ty.com

configs:
  params:
    server.insecure: "true"
  cm:
    create: true
    url: https://argocd.m15ty.com
    kustomize.buildOptions: --enable-helm
    "oidc.config": |
      name: kanidm
      issuer: https://auth.m15ty.com/oauth2/openid/argocd
      clientID: argocd
      clientSecret: $argocd-kanidm-oauth2-credentials:CLIENT_SECRET
      requestedScopes: ["openid", "profile", "email", "groups_name"]
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, cluster-admins, role:admin
      g, idm_all_persons, role:readonly
  # secret:
  #   githubSecret:
  #     secretKeyRef:
  #       name: argocd-webhook
  #       key: github-secret-key

dex:
  enabled: false

controller:
  metrics:
    enabled: true

repoServer:
  metrics:
    enabled: true

applicationSet:
  metrics:
    enabled: true
