apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    # Must be healthy before Open WebUI's ExternalSecret is applied.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: k8s-home

  source:
    repoURL: https://github.com/alexvegas22/k8s-home
    targetRevision: talos
    path: system/external-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    syncOptions:
      # ESO CRDs are large; client-side apply can exceed annotation limits.
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
