---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey-operator
  namespace: valkey-operator-system
spec:
  interval: 1h
  releaseName: valkey-operator
  chart:
    spec:
      chart: valkey-operator
      version: "0.4.0"
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  install:
    createNamespace: true
