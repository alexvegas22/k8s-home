---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1h
  releaseName: flux-operator
  chart:
    spec:
      chart: flux-operator
      version: "0.55.0"
      sourceRef:
        kind: HelmRepository
        name: flux-operator
        namespace: flux-system
  install:
    createNamespace: false
  upgrade:
    remediation:
      retries: 3
