---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argocd
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./system/argocd
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-home
  targetNamespace: argocd
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
