---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-system
  interval: 10m0s
  path: ./operators/flux-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-home
  targetNamespace: flux-system
