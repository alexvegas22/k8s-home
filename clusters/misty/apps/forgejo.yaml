---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo
  namespace: flux-system
spec:
  dependsOn:
    - name: cloudnative-pg
    - name: valkey
  interval: 10m0s
  path: ./apps/forgejo
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-home
  targetNamespace: forgejo
